<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prison Management Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1317; --panel:#161c22; --panel2:#1c242c; --line:#2a343e; --line2:#36424e;
  --txt:#dfe6ec; --mut:#8a98a6; --dim:#5d6b78;
  --acc:#f08a24; --acc2:#ffb066; --accbg:rgba(240,138,36,.12);
  --good:#4cc38a; --warn:#e8b931; --bad:#ef5b5b; --info:#5aa9e6;
  --min:#4cc38a; --med:#5aa9e6; --max:#e8b931; --smx:#ef5b5b;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 var(--sans)}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc2)}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)} .dim{color:var(--dim)} .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .info{color:var(--info)}
.small{font-size:12px} .tiny{font-size:11px}
.right{text-align:right} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.hide{display:none!important}

/* App shell */
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:#0b0e11;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap;min-width:0}
.brand .logo{width:28px;height:28px;border-radius:6px;background:var(--acc);display:grid;place-items:center;color:#111;font-family:var(--mono);font-weight:700;font-size:13px;flex:none}
.brand .pname{overflow:hidden;text-overflow:ellipsis;max-width:220px}
.clock{font-family:var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;white-space:nowrap}
.clock b{color:var(--acc2);font-weight:600}
.speeds{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.speeds button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:5px 9px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--mut)}
.speeds button:last-child{border-right:0}
.speeds button.on{background:var(--acc);color:#111;font-weight:600}
.hstat{font-family:var(--mono);font-size:13px;white-space:nowrap}
.hstat span{color:var(--mut);font-family:var(--sans);font-size:11px;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.hbtn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;position:relative;white-space:nowrap}
.hbtn:hover{border-color:var(--line2)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-family:var(--mono)}
#menuBtn{display:none}
nav{background:#0d1114;border-right:1px solid var(--line);overflow-y:auto;padding:8px 0}
nav a{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--mut);text-decoration:none;cursor:pointer;border-left:3px solid transparent;font-size:13.5px}
nav a:hover{color:var(--txt);background:var(--panel)}
nav a.on{color:var(--txt);border-left-color:var(--acc);background:var(--accbg)}
nav a .n{font-family:var(--mono);font-size:10px;color:var(--dim);width:16px}
nav a .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:8px;padding:0 6px}
main{overflow-y:auto;padding:20px 22px 60px;min-width:0}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
h3{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mut);margin:0 0 16px;font-size:13px}

/* Panels */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card.tight{padding:10px 12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--mono);font-size:22px;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mut)}
.mb{margin-bottom:14px} .mt{margin-top:14px} .mt6{margin-top:6px}
.sep{border-top:1px solid var(--line);margin:12px 0}

/* Buttons & inputs */
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.danger{border-color:#6b2b2b;color:#ff9a9a}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number],select{background:#0d1114;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:80px}
input:focus,select:focus{outline:none;border-color:var(--acc)}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.field{margin-bottom:12px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{background:#0d1114;border:0;border-right:1px solid var(--line2);padding:6px 12px;cursor:pointer;color:var(--mut)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accbg);color:var(--acc2)}

/* Tables */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tbar input[type=text]{width:220px}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--panel2);text-align:left;font-weight:500;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
th.s{cursor:pointer} th.s:hover{color:var(--txt)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tr.click{cursor:pointer}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--mut)}

/* Tags & bars */
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-family:var(--mono);border:1px solid currentColor;line-height:1.5}
.c-Minimum{color:var(--min)} .c-Medium{color:var(--med)} .c-Maximum{color:var(--max)} .c-Supermax{color:var(--smx)} .c-Protective{color:#c38cf0}
.sv-Minor{color:var(--mut)} .sv-Moderate{color:var(--warn)} .sv-Major{color:#ff8a4c} .sv-Critical{color:var(--bad)}
.bar{height:6px;background:#0b0e11;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--good)}
.bar.w i{background:var(--warn)} .bar.b i{background:var(--bad)}
.needrow{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:12px;margin-bottom:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* Notifications */
.feed{max-height:340px;overflow-y:auto}
.note{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.note:last-child{border-bottom:0}
.note .t{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;padding-top:2px}
.note.bad .m{color:#ffb3b3} .note.warn .m{color:#f3d987} .note.good .m{color:#9fe3c2}
.alert{border-left:3px solid var(--warn);background:rgba(232,185,49,.07);padding:8px 12px;border-radius:4px;margin-bottom:8px;font-size:13px}
.alert.bad{border-left-color:var(--bad);background:rgba(239,91,91,.07)}
.alert.good{border-left-color:var(--good);background:rgba(76,195,138,.07)}
.alert.info{border-left-color:var(--info);background:rgba(90,169,230,.07)}

/* Modal & toast */
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:100%;max-width:760px;padding:18px;position:relative}
.modal.narrow{max-width:440px}
.mclose{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:2px 4px 2px 10px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap}
.chip input[type=number]{width:46px;padding:1px 4px;font-size:12px}
.chip .x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.chip .x:hover{color:var(--bad)}
.chip.d{border-color:#6b2b2b}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.chips select{font-size:12px;padding:3px 6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:7px 12px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--mut)}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:340px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--info);padding:9px 12px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)} .toast.good{border-left-color:var(--good)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* Schedule grid */
.sched{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sched .col{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px}
.srow{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;margin-bottom:3px}
.srow select{padding:3px 4px;font-size:12px;width:100%;border-left-width:4px}

/* Block cards */
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cells{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.cell{width:14px;height:14px;border-radius:2px;background:#0b0e11;border:1px solid var(--line2)}
.cell.p{background:rgba(240,138,36,.45);border-color:var(--acc)}
.cell.f{background:var(--acc);border-color:var(--acc)}

/* Menu screen */
#menu{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;
  background:radial-gradient(ellipse at top,#1d2630 0%,var(--bg) 60%)}
.menuBox{width:100%;max-width:820px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.hero .logo{width:54px;height:54px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#111;font:700 20px var(--mono)}
.hero h1{font-size:26px}
.bars-deco{height:6px;background:repeating-linear-gradient(90deg,var(--acc) 0 3px,transparent 3px 14px);opacity:.5;margin:0 0 20px;border-radius:2px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice button{background:#0d1114;border:1px solid var(--line2);border-radius:8px;padding:10px;cursor:pointer;text-align:left}
.choice button.on{border-color:var(--acc);background:var(--accbg)}
.choice button b{display:block;font-size:14px}
.choice button span{font-size:12px;color:var(--mut)}
.lockbanner{position:fixed;inset:56px 0 0 0;background:rgba(10,12,14,.85);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.obj{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.obj:last-child{border-bottom:0}
.obj .ck{width:18px;height:18px;border-radius:4px;border:1px solid var(--line2);flex:none;display:grid;place-items:center;font-size:12px}
.obj.done .ck{background:var(--good);border-color:var(--good);color:#111}
.obj.cur{background:var(--accbg);margin:0 -14px;padding:8px 14px}
svg.spark{display:block;width:100%;height:40px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.sched{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  header{grid-column:1;flex-wrap:wrap;padding:8px 10px;gap:8px}
  #menuBtn{display:inline-block}
  .brand .pname{max-width:130px}
  nav{position:fixed;top:0;left:0;bottom:0;width:240px;z-index:45;transform:translateX(-100%);transition:transform .2s}
  nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  main{padding:14px 12px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-m{display:none!important}
  .choice{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .sched{grid-template-columns:1fr}
  .lockbanner{inset:0}
  .tbar input[type=text]{width:100%}
}
</style></head><body>
<div id="menu" class="hide"></div><div id="app" class="hide"><header id="hdr"></header><nav id="nav"></nav><main id="main"></main></div><div id="modalBg" class="hide"></div><div id="toasts"></div>
<script>
'use strict';
/* ================= Utilities ================= */
const $ = s => document.querySelector(s);
const rnd = Math.random;
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a = 0, b = 100) => v < a ? a : v > b ? b : v;
const fmt$ = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString();
const fmtN = n => Math.round(n).toLocaleString();
const pct = n => Math.round(n * 100) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const avg = (a, f = x => x) => a.length ? sum(a, f) / a.length : 0;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wpick = (items) => { let t = sum(items, x => x[1]); let r = rnd() * t; for (const [v, w] of items) { if ((r -= w) <= 0) return v; } return items[items.length - 1][0]; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ================= Constants ================= */
const CLASSES = ['Minimum', 'Medium', 'Maximum', 'Supermax', 'Protective', 'DeathRow', 'Insane'];
const CLS_SHORT = { Minimum: 'MIN', Medium: 'MED', Maximum: 'MAX', Supermax: 'SMX', Protective: 'PC', DeathRow: 'DR', Insane: 'CI' };
const CLS_LABEL = { Minimum: 'Minimum', Medium: 'Medium', Maximum: 'Maximum', Supermax: 'Supermax', Protective: 'Protective Custody', DeathRow: 'Death Row', Insane: 'Criminally Insane' };
const CLS_MULT = { Minimum: .7, Medium: 1, Maximum: 1.4, Supermax: 1.7, Protective: .6, DeathRow: 1.2, Insane: 1.6 };
const OFFICER_RATIO = { Minimum: 20, Medium: 12, Maximum: 6, Supermax: 3, Protective: 8, DeathRow: 3, Insane: 4 };
const PAROLE_FRAC = { Minimum: .5, Medium: .6, Maximum: .7, Supermax: .85, Protective: .6, DeathRow: null, Insane: .75 };
const DEFAULT_FUNDING = { Minimum: 60, Medium: 75, Maximum: 110, Supermax: 180, Protective: 105, DeathRow: 230, Insane: 200 };
const DEFAULT_INTAKE = { Minimum: 5, Medium: 10, Maximum: 4, Supermax: 1, Protective: 1, DeathRow: .2, Insane: .5 };
const BEDS_PER_CELL = { Minimum: 2, Medium: 2, Maximum: 1, Supermax: 1, Protective: 1, DeathRow: 1, Insane: 1 };
const CELL_BASE_COST = { Minimum: 2200, Medium: 2800, Maximum: 4200, Supermax: 7000, Protective: 4000, DeathRow: 7500, Insane: 6000 };
const NEVER = 999999; // death row: no release or parole date
const APPEAL_STAGES = ['Direct appeal', 'State post-conviction review', 'Federal habeas corpus', 'Clemency petition'];
const CAPITAL_CHARGES = ['Capital murder', 'Murder with special circumstances', 'Multiple homicide', 'Murder of a law enforcement officer', 'Murder during a kidnapping'];
const INSANE_DX = ['Paranoid schizophrenia', 'Schizoaffective disorder', 'Bipolar disorder with psychotic features', 'Delusional disorder', 'Severe psychotic depression'];
const PC_REASONS = ['Former police officer', 'Former corrections officer', 'Informant / cooperating witness', 'Gang dropout', 'High-profile case', 'Vulnerable (age or health)', 'Former prosecutor\'s investigator', 'Testified against co-defendants'];
const YARD_CAP = 100, YARD_COST = 30000;
const WEATHER = [['Clear', 45], ['Cloudy', 30], ['Rain', 18], ['Storm', 7]];
const TIERS = {
  1: { name: 'Basic', util: 2, cellCost: 0, comfort: -1.2, desc: 'Bed, toilet, basic amenities' },
  2: { name: 'Standard', util: 3.5, cellCost: 1800, comfort: 0, desc: 'Adds shower access and extra basics' },
  3: { name: 'Premium', util: 5.5, cellCost: 4500, comfort: 1.2, desc: 'Improved amenities, storage and comfort' }
};
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const ROLES = {
  'Correctional Officer': { dept: 'Security', sal: 46000 },
  'Warden': { dept: 'Administration', sal: 98000 },
  'Administrator': { dept: 'Administration', sal: 52000 },
  'Medical Staff': { dept: 'Healthcare', sal: 72000 },
  'Psychologist': { dept: 'Healthcare', sal: 85000 },
  'Teacher': { dept: 'Rehabilitation', sal: 50000 },
  'Kitchen Worker': { dept: 'Food Services', sal: 32000 },
  'Maintenance Worker': { dept: 'Facilities', sal: 38000 },
  'Rehabilitation Specialist': { dept: 'Rehabilitation', sal: 58000 },
  'Psychiatrist': { dept: 'Healthcare', sal: 125000 }
};
const ROLE_NAMES = Object.keys(ROLES);

const TRAITS = {
  'Cooperative': { inc: .5, beh: 10 },
  'Aggressive': { inc: 2.1, beh: -12 },
  'Introverted': { inc: .85, beh: 2 },
  'Manipulative': { inc: 1.35, beh: -6 },
  'Rebellious': { inc: 1.7, beh: -10 },
  'Leadership-oriented': { inc: 1.05, beh: 0 },
  'Easily influenced': { inc: 1.2, beh: -2 },
  'Calm': { inc: .6, beh: 8 },
  'Anxious': { inc: 1.1, beh: 0 },
  'Hardworking': { inc: .8, beh: 6 }
};
const TRAIT_NAMES = Object.keys(TRAITS);
const TRAIT_CLASH = [['Aggressive', 'Aggressive'], ['Aggressive', 'Rebellious'], ['Manipulative', 'Cooperative'], ['Rebellious', 'Cooperative'], ['Aggressive', 'Anxious'], ['Leadership-oriented', 'Leadership-oriented'], ['Manipulative', 'Aggressive']];
const TRAIT_BOND = [['Cooperative', 'Cooperative'], ['Calm', 'Introverted'], ['Hardworking', 'Hardworking'], ['Leadership-oriented', 'Easily influenced'], ['Calm', 'Cooperative'], ['Hardworking', 'Cooperative']];

const GANGS = ['Iron Brotherhood', 'South Side Kings', 'Black Ravens', 'Los Lobos', 'Northern Crew'];

const ACTS = {
  Sleep: { c: '#33415c', l: 'Sleep' },
  Wake: { c: '#6b7c93', l: 'Wake up' },
  Meal: { c: '#4cc38a', l: 'Meal' },
  Work: { c: '#e8b931', l: 'Employment' },
  Yard: { c: '#3fae6a', l: 'Yard (outdoors)' },
  Recreation: { c: '#5aa9e6', l: 'Recreation (indoor)' },
  Rehab: { c: '#b48ef0', l: 'Rehabilitation' },
  Shower: { c: '#45c4c4', l: 'Shower' },
  Free: { c: '#8fbf5a', l: 'Free time' },
  Visits: { c: '#f08a24', l: 'Visitation' },
  Lockdown: { c: '#7a3b3b', l: 'Lockdown (in cell)' }
};
const ACT_NAMES = Object.keys(ACTS);
function defaultSchedule(cls) {
  const s = Array(24).fill('Sleep');
  s[6] = 'Wake'; s[7] = 'Meal';
  if (cls === 'DeathRow') {
    for (let h = 8; h < 22; h++) s[h] = 'Lockdown';

    return s;
  }

  }

}

    'Medical Staff': Math.max(1, Math.ceil(cap / 60)),
    'Kitchen Worker': Math.max(1, Math.ceil(cap / 60)),
    'Maintenance Worker': Math.max(1, Math.ceil(cap / 100)),
    'Teacher': cap >= 100 ? 1 : 0,
    'Psychologist': cap >= 150 ? 1 : 0,
    'Rehabilitation Specialist': cap >= 100 ? 1 : 0,
    'Psychiatrist': Math.ceil(sum(S.blocks.filter(b => b.cls === 'Insane' || b.cls === 'DeathRow'), blockCap) / 15)
  };
}

/* ---------- Blocks ---------- */
function addBlock(name, cls, cells, beds, tier, instant) {
  const b = { id: 'B' + (S.seq.blk++), name, cls, tier, status: instant ? 'Open' : 'Construction', buildLeft: instant ? 0 : 2, cells: [], contraband: 5, incidents: 0, cancelled: false };
  for (let i = 0; i < cells; i++) b.cells.push({ n: i + 1, beds, occ: [] });
  S.blocks.push(b);
  return b;
}
function blockCap(b) { return sum(b.cells, c => c.beds); }
function blockOcc(b) { return sum(b.cells, c => c.occ.length); }
function totalCapacity(cls) { return sum(S.blocks.filter(b => b.status !== 'Construction' && (!cls || b.cls === cls)), blockCap); }
function freeBeds(cls) { return sum(S.blocks.filter(b => b.cls === cls && b.status !== 'Construction' && b.status !== 'Closed'), b => blockCap(b) - blockOcc(b)); }
function getBlock(id) { return S.blocks.find(b => b.id === id); }
function findBed(cls, exclude) {
  // Prefer the open block with the most free space, fill cells that already have someone first for 2-bed cells
  const blocks = S.blocks.filter(b => b.cls === cls && b.status === 'Open' || (b.cls === cls && b.status === 'Lockdown'));
  let best = null, bestFree = -1;
  for (const b of blocks) { const f = blockCap(b) - blockOcc(b); if (f > bestFree && f > 0) { best = b; bestFree = f; } }
  if (!best) return null;
  const cell = best.cells.find(c => c.occ.length > 0 && c.occ.length < c.beds && (!exclude || !c.occ.some(id => exclude.includes(id)))) || best.cells.find(c => c.occ.length === 0) || best.cells.find(c => c.occ.length < c.beds);
  return cell ? { b: best, c: cell } : null;
}
function cellOf(i) { const b = getBlock(i.blk); return b ? b.cells.find(c => c.n === i.cell) : null; }
function vacate(i) { const c = cellOf(i); if (c) c.occ = c.occ.filter(x => x !== i.id); i.blk = null; i.cell = null; }
function place(i, b, c) { vacate(i); c.occ.push(i.id); i.blk = b.id; i.cell = c.n; }
function cellLabel(i) { const b = getBlock(i.blk); return b ? `${b.name} · Cell ${i.cell}` : '—'; }

/* ---------- Generation ---------- */
function genName(g) { return [pick(g === 'Female' ? F_FIRST : M_FIRST), pick(LAST)]; }
function genInmate(cls) {
  const id = 'P-' + String(S.seq.inm++).padStart(5, '0');
  const [fn, ln] = genName(S.pop);
  const [a, b] = SEV_RANGE[cls]; const sev = ri(a, b);
  const charges = [pick(CHARGES[sev])];
  if (rnd() < .4) { const c = pick(CHARGES[Math.max(1, sev - ri(0, 1))]); if (!charges.includes(c)) charges.push(c); }
  if (rnd() < .12) { const c = pick(CHARGES[Math.max(1, sev - 1)]); if (!charges.includes(c)) charges.push(c); }
  const priors = Math.max(0, Math.round((rnd() * rnd()) * (sev + 4)));
  const [s1, s2] = SENT_RANGE[sev];
  const sent = Math.round(ri(s1, s2) * (1 + priors * .07) * (1 + (charges.length - 1) * .15));
  // traits
  const pool = [];
  TRAIT_NAMES.forEach(t => { let w = 10; if (cls === 'Insane') { if (['Aggressive', 'Anxious', 'Easily influenced', 'Rebellious'].includes(t)) w = 16; if (['Calm', 'Hardworking'].includes(t)) w = 4; } if (cls === 'Protective') { if (['Introverted', 'Anxious', 'Cooperative', 'Calm'].includes(t)) w = 18; if (['Aggressive', 'Rebellious'].includes(t)) w = 3; } if (cls === 'Supermax' || cls === 'Maximum') { if (['Aggressive', 'Rebellious', 'Manipulative', 'Leadership-oriented'].includes(t)) w = 18; if (['Cooperative', 'Calm'].includes(t)) w = 5; } if (cls === 'Minimum' && ['Cooperative', 'Calm', 'Hardworking', 'Introverted'].includes(t)) w = 16; pool.push([t, w]); });
  const traits = [wpick(pool)]; let t2; do { t2 = wpick(pool); } while (t2 === traits[0] || (t2 === 'Calm' && traits[0] === 'Anxious') || (t2 === 'Anxious' && traits[0] === 'Calm') || (t2 === 'Cooperative' && traits[0] === 'Rebellious') || (t2 === 'Rebellious' && traits[0] === 'Cooperative'));
  traits.push(t2);
  const traitRisk = sum(traits, t => (TRAITS[t].inc - 1) * 12);
  const riskScore = sev * 12 + priors * 3 + traitRisk + ri(-5, 5);
  const risk = riskScore < 30 ? 'Low' : riskScore < 48 ? 'Moderate' : riskScore < 66 ? 'High' : 'Extreme';
  const pre = Math.floor(sent * rnd() * .15);
  const d = curDay();
  const gangP = { Minimum: .04, Medium: .14, Maximum: .3, Supermax: .45, Protective: 0, DeathRow: .15, Insane: 0 }[cls];
  const i = {
    id, fn, ln, age: ri(18, 64 - (rnd() < .6 ? 25 : 0)), g: S.pop, adm: d, cls, risk, charges, sev, priors, sent,
    start: d - pre, parole: d + Math.max(2, Math.ceil(sent * PAROLE_FRAC[cls]) - pre), release: d + sent - pre,
    blk: null, cell: null, traits,
    n: { hunger: ri(55, 80), hygiene: ri(45, 80), rec: ri(45, 75), health: ri(65, 95), social: ri(45, 75), comfort: ri(45, 70), stress: ri(25, 55), safety: ri(45, 70) },
    beh: clamp(55 + sum(traits, t => TRAITS[t].beh) - sev * 3 + ri(-8, 8), 5, 95),
    disc: 'Good', discUntil: 0, lastInc: -99, incCount: 0,
    job: null, jobSince: 0, jobHist: [], earn: 0, bal: ri(0, 40), tx: [],
    prog: null, progHrs: 0, progStart: 0, progHist: [], certs: [],
    friends: [], rivals: [], gang: rnd() < gangP ? pick(GANGS) : null,
    hist: [], hearing: null, infirm: false, sick: false, loc: 'Intake', paroleRec: 0, hearings: 0,
    pc: cls === 'Protective' ? pick(PC_REASONS) : null,
    psych: cls === 'Insane' ? ri(25, 60) : null, dx: cls === 'Insane' ? pick(INSANE_DX) : null, progWant: null, progWhy: null
  };
  if (cls === 'DeathRow') {
    i.charges = [pick(CAPITAL_CHARGES)].concat(rnd() < .4 ? [pick(CHARGES[4])] : []); i.sent = 0; i.parole = NEVER; i.release = NEVER;
    i.appeal = { stage: 0, next: d + ri(20, 40), legal: 0, support: 0, log: [], exec: null };
  }
  if (cls === 'Insane') i.charges[0] += ' (found not guilty by reason of insanity)';
  if (i.pc === 'Vulnerable (age or health)') i.age = ri(58, 79);
  ihist(i, `Admitted. Charges: ${i.charges.join(', ')}. ${cls === 'DeathRow' ? 'Sentenced to death; mandatory appeals begin.' : 'Sentence ' + i.sent + ' days.'}${i.pc ? ' Protective custody: ' + i.pc + '.' : ''}${i.dx ? ' Diagnosis: ' + i.dx + '.' : ''}`);
  return i;
}

/* ---------- Ledger & notes ---------- */

/* ================= Simulation engine ================= */
function shiftOf(h) { return h >= 6 && h < 18 ? 'Day' : 'Night'; }

/* Officer coverage per block for a shift: on-duty assigned officers / required */
function officersRequired(b, shift) {
  const occ = blockOcc(b); if (!occ) return 0;
  const r = Math.ceil(occ / OFFICER_RATIO[b.cls]);
  return shift === 'Night' ? Math.max(1, Math.ceil(r / 2)) : r;
}
function blockCoverage(b, shift) {
  const req = officersRequired(b, shift); if (!req) return 1;
  const on = S.staff.filter(s => s.role === 'Correctional Officer' && s.assign === b.id && s.shift === shift && s.present);
  const eff = sum(on, s => .85 + s.perf / 650); // ~0.9..1.0
  // Unassigned officers on this shift float and help at 50%
  return clamp(eff / req, 0, 1.2);
}
function floatingHelp(shift) {
  return S.staff.filter(s => s.role === 'Correctional Officer' && !s.assign && s.shift === shift && s.present).length;
}
function computeCoverage(shift) {
  const res = {};
  let floatPool = floatingHelp(shift) * .5;
  const open = S.blocks.filter(b => b.status !== 'Construction' && b.status !== 'Closed');
  open.forEach(b => res[b.id] = blockCoverage(b, shift));
  // distribute floaters to worst blocks
  const sorted = open.slice().sort((a, b) => res[a.id] - res[b.id]);
  for (const b of sorted) {
    if (floatPool <= 0) break;
    const req = officersRequired(b, shift); if (!req || res[b.id] >= 1) continue;
    const need = (1 - res[b.id]) * req; const give = Math.min(need, floatPool);
    res[b.id] += give / req; floatPool -= give;
  }
  return res;
}
function avgCoverage() {
  const d = computeCoverage('Day'), n = computeCoverage('Night');
  const bl = S.blocks.filter(b => blockOcc(b) > 0 && d[b.id] != null);
  if (!bl.length) return 1;
  return sum(bl, b => (Math.min(1, d[b.id]) * 2 + Math.min(1, n[b.id])) / 3 * blockOcc(b)) / sum(bl, blockOcc);
}

/* Support staffing requirements */
function requirements() {
  const pop = S.inm.length, beds = totalCapacity();
  const kitchenInm = S.inm.filter(i => i.job === 'Kitchen').length;
  const offReq = sum(S.blocks, b => officersRequired(b, 'Day') + officersRequired(b, 'Night'));
  return {
    'Correctional Officer': offReq,
    'Medical Staff': Math.ceil(pop / 40),
    'Kitchen Worker': Math.max(pop ? 1 : 0, Math.ceil(Math.max(0, pop - kitchenInm * 15) / 40)),
    'Maintenance Worker': Math.ceil(beds / 75),
    'Administrator': Math.max(1, Math.ceil(sum(CLASSES, c => S.settings.intake[c]) / 25)),
    'Teacher': Math.ceil(enrolledFor('Teacher') / 15),
    'Psychologist': Math.ceil(enrolledFor('Psychologist') / 11),
    'Rehabilitation Specialist': Math.ceil(enrolledFor('Rehabilitation Specialist') / 13),
    'Psychiatrist': Math.ceil(S.inm.filter(i => i.cls === 'Insane' || i.cls === 'DeathRow').length / 15),
    'Warden': pop >= 80 ? 1 : 0

}
function enrolledFor(role) { return S.inm.filter(i => i.prog && PROGRAMS[i.prog].role === role).length; }
function kitchenCapacity() {
  const k = S.staff.filter(s => s.role === 'Kitchen Worker' && s.present);
  return Math.round(sum(k, s => 40 * (.8 + s.perf / 500))) + S.inm.filter(i => i.job === 'Kitchen' && i.disc !== 'Solitary').length * 15;
}

function mealCost() { return { Basic: 2.0, Standard: 2.8, Quality: 4.0 }[S.settings.mealQuality]; }
function mealsPerDay() { return Math.max(1, Math.round(avg(CLASSES.filter(c => S.inm.some(i => i.cls === c)), c => S.sched[c].filter(a => a === 'Meal').length) || 3)); }
function dailyFoodUse() { return S.inm.length * mealsPerDay(); }
function avgNeed(k, list = S.inm) { return list.length ? avg(list, i => i.n[k]) : 0; }

/* Funding */
function compliance() {
  const cov = Math.min(1, avgCoverage());
  const req = requirements();
  const support = ['Medical Staff', 'Kitchen Worker', 'Maintenance Worker'].map(r => req[r] ? Math.min(1, staffCount(r) / req[r]) : 1);
  let c = .8 + .15 * cov + .05 * avg(support);
  if (S.unlock.bonus && S.lastInspection && S.lastInspection.score >= 80 && curDay() - S.lastInspection.d <= 30) c += .05;
  return Math.round(c * 1000) / 1000;
}
function fundingBreakdown() {
  const c = compliance();
  return CLASSES.map(cls => { const n = S.inm.filter(i => i.cls === cls).length; return { cls, n, rate: S.settings.funding[cls], total: n * S.settings.funding[cls] * c }; }).concat([{ comp: c }]);
}

/* ---------- Intake ---------- */
function processIntake() {
  const T = S.today.intake;
  let capLeft = intakeCapacity();
  // queue first
  const stillQ = [];
  for (const i of S.queue) {
    if (capLeft > 0) { const spot = findBed(i.cls); if (spot) { place(i, spot.b, spot.c); i.loc = 'Cell'; S.inm.push(i); ihist(i, `Admitted from pending queue to ${cellLabel(i)}.`); T.fromQueue++; capLeft--; afterAdmit(i); continue; } }
    stillQ.push(i);
  }
  S.queue = stillQ;
  if (!S.settings.intakeOn) return intakeSummary();
  for (const cls of CLASSES) {
    if (!S.unlock.classes.includes(cls)) continue;
    const v = +S.settings.intake[cls] || 0; const n = Math.floor(v) + (rnd() < v % 1 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const i = genInmate(cls);
      T.recv[cls] = (T.recv[cls] || 0) + 1;
      const spot = capLeft > 0 ? findBed(cls) : null;
      if (spot) { place(i, spot.b, spot.c); i.loc = 'Cell'; S.inm.push(i); ihist(i, `Assigned to ${cellLabel(i)}.`); capLeft--; afterAdmit(i); }
      else if (S.settings.overflow === 'queue' && S.queue.length < S.settings.queueMax) { i.queued = curDay(); i.loc = 'Pending intake'; S.queue.push(i); T.queued++; if (capLeft <= 0 && !T.limited.includes('processing')) T.limited.push('processing'); else if (!T.limited.includes(cls)) T.limited.push(cls); }
      else { T.rejected++; S.seq.inm; if (!T.limited.includes(cls)) T.limited.push(cls); }
    }
  }
  intakeSummary();
}
function afterAdmit(i) {
  S.arrivals.unshift(i.id); if (S.arrivals.length > 40) S.arrivals.length = 40;
  if (S.settings.autoJobs) tryAssignJob(i);
  if (S.settings.autoEnroll) tryEnroll(i);
  // initial relationships with blockmates of same gang
  if (i.gang) { const mates = S.inm.filter(x => x.blk === i.blk && x.gang === i.gang && x.id !== i.id).slice(0, 2); mates.forEach(m => befriend(i, m)); }
}
function intakeSummary() {
  const T = S.today.intake;
  const recv = sum(Object.values(T.recv));
  const parts = CLASSES.filter(c => T.recv[c]).map(c => `${T.recv[c]} ${c}`).join(', ');
  const admitted = recv - T.queued - T.rejected + T.fromQueue;
  let msg = `Intake: ${recv} received${parts ? ' (' + parts + ')' : ''}. ${admitted} admitted`;
  if (T.fromQueue) msg += ` (${T.fromQueue} from queue)`;
  if (T.queued) msg += `, ${T.queued} placed in pending queue`;
  if (T.rejected) msg += `, ${T.rejected} redirected to other facilities`;
  msg += `. Free beds: ${CLASSES.filter(c => S.unlock.classes.includes(c)).map(c => CLS_SHORT[c] + ' ' + freeBeds(c)).join(' · ')}.`;
  const lvl = T.rejected || T.queued ? 'warn' : 'info';
  note(lvl, msg);
  if (T.limited.includes('processing')) note('warn', `Intake processing limit reached (${intakeCapacity()}/day). Hire Administrators to process more admissions.`);
}

/* ---------- Jobs & programs ---------- */
function jobFilled(j) { return S.inm.filter(i => i.job === j).length; }
function jobEligible(i, j) { const cfg = S.jobs[j]; return S.unlock.jobs[j] && cfg.on && cfg.elig.includes(i.cls) && i.disc !== 'Solitary' && !i.infirm; }
function tryAssignJob(i) {

  const opts = JOB_NAMES.filter(j => jobEligible(i, j) && jobFilled(j) < S.jobs[j].pos);
  if (!opts.length) return false;
  // Hardworking prefer workshop; else most open
  opts.sort((a, b) => (S.jobs[b].pos - jobFilled(b)) - (S.jobs[a].pos - jobFilled(a)));
  setJob(i, opts[0]); return true;
}
function setJob(i, j) {
  if (i.job) { const h = i.jobHist.find(x => x.j === i.job && !x.end); if (h) h.end = curDay(); ihist(i, `Left ${i.job} job.`); }
  i.job = j || null;
  if (j) { i.jobSince = curDay(); i.jobHist.unshift({ j, start: curDay(), end: null }); if (i.jobHist.length > 8) i.jobHist.length = 8; ihist(i, `Started work: ${j} ($${S.jobs[j].wage.toFixed(2)}/hr).`); }
}
function progEnrolled(p) { return S.inm.filter(i => i.prog === p).length; }
function progSeats(p) { return staffCount(PROGRAMS[p].role, true) * PROGRAMS[p].per; }
function progEligible(i, p) { const c = S.progs[p]; return S.unlock.progs[p] && c.on && c.elig.includes(i.cls) && (PROGRAMS[p].repeat || !i.certs.includes(p)); }
function progRoom(p) { return progEnrolled(p) < Math.min(S.progs[p].cap, progSeats(p) || staffCount(PROGRAMS[p].role) * PROGRAMS[p].per); }
/* Inmates choose programs based on their own personality, needs and history */
function programWishes(i) {
  const w = [];
  const add = (p, score, why) => { if (progEligible(i, p) && staffCount(PROGRAMS[p].role) > 0) w.push({ p, score: score + rnd() * 2, why }); };
  const t = x => i.traits.includes(x);
  add('Anger Management', t('Aggressive') ? 6 : i.incCount > 2 ? 3 : 0, t('Aggressive') ? 'wants to control their temper' : 'wants to stay out of trouble');
  add('Substance Recovery', i.charges.some(c => /Drug|alcohol|narcotic/i.test(c)) ? 6 : 0.5, i.charges.some(c => /Drug/i.test(c)) ? 'wants to beat an addiction' : 'curious about recovery support');
  add('Vocational Training', t('Hardworking') ? 5 : i.age < 35 ? 2.5 : 1, t('Hardworking') ? 'wants to learn a trade' : 'wants job skills for release');
  add('Education', t('Introverted') ? 4 : i.age < 26 ? 3.5 : 1.5, i.age < 26 ? 'wants to finish school' : 'enjoys studying');
  add('Counseling', (t('Anxious') ? 4 : 0) + (i.n.stress > 60 ? 3 : 0), i.n.stress > 60 ? 'is struggling with stress' : 'wants someone to talk to');
  add('Life Skills', t('Leadership-oriented') ? 3.5 : remaining(i) < 40 ? 4 : 1.5, remaining(i) < 40 ? 'is preparing for release' : 'wants practical skills');
  add('Psychiatric Treatment', i.cls === 'Insane' ? 7 + (60 - (i.psych || 60)) / 10 : i.cls === 'DeathRow' ? 5 : 0, i.cls === 'Insane' ? 'was referred for ongoing psychiatric care' : 'wants support while facing a death sentence');
  if (t('Manipulative')) w.forEach(x => { x.score += PROGRAMS[x.p].fx.parole / 4; x.why = 'thinks it will impress the parole board'; });
  return w.sort((a, b) => b.score - a.score);
}
function inmateChooses(i) {
  if (i.prog) return false;
  const t = x => i.traits.includes(x);
  if (t('Rebellious') && rnd() < .5) return false; // refuses this time
  if (i.disc === 'Solitary') return false;
  const w = programWishes(i); if (!w.length) return false;
  const top = w[0];
  if (progRoom(top.p)) { setProg(i, top.p, `chose it — ${top.why}`); i.progWant = null; return true; }
  // Top choice full: cooperative/easily influenced inmates settle for second choice, others join the waitlist
  if ((t('Cooperative') || t('Easily influenced')) && w[1] && progRoom(w[1].p)) { setProg(i, w[1].p, `${top.p} was full, settled for this — ${w[1].why}`); i.progWant = null; return true; }
  if (i.progWant !== top.p) { i.progWant = top.p; i.progWhy = top.why; ihist(i, `Applied for ${top.p} (${top.why}); placed on the waitlist.`); }
  return false;
}
function tryEnroll(i) {
  if (i.prog) return false;
  if (S.settings.progChoice !== 'admin') return inmateChooses(i);
  let opts = PROG_NAMES.filter(p => progEligible(i, p) && progEnrolled(p) < Math.min(S.progs[p].cap, progSeats(p) || staffCount(PROGRAMS[p].role) * PROGRAMS[p].per));
  if (!opts.length) return false;
  // Targeted: aggressive → anger mgmt; drug charges → recovery
  const pref = p => (p === 'Anger Management' && i.traits.includes('Aggressive') ? -10 : 0) + (p === 'Substance Recovery' && i.charges.some(c => /Drug/.test(c)) ? -10 : 0) + (p === 'Counseling' && i.n.stress > 60 ? -5 : 0) + progEnrolled(p) / Math.max(1, progSeats(p));
  opts.sort((a, b) => pref(a) - pref(b));

}
function setProg(i, p, why) {
  if (i.prog) { i.progHist.unshift({ p: i.prog, start: i.progStart, end: curDay(), hrs: Math.round(i.progHrs), done: false }); ihist(i, `Withdrew from ${i.prog}.`); }
  i.prog = p || null; i.progHrs = 0; i.progStart = curDay(); i.progWhy = p ? (why || 'assigned by administration') : null;
  if (p) { i.progWant = null; ihist(i, `Enrolled in ${p} (${i.progWhy}).`); }
}
function completeProg(i) {
  const p = i.prog, P = PROGRAMS[p];
  i.progHist.unshift({ p, start: i.progStart, end: curDay(), hrs: P.hrs, done: true }); if (i.progHist.length > 10) i.progHist.length = 10;
  if (!i.certs.includes(p)) i.certs.push(p); i.beh = clamp(i.beh + P.fx.beh); i.paroleRec += P.fx.parole;
  if (P.fx.calm && i.traits.includes('Aggressive')) { i.traits[i.traits.indexOf('Aggressive')] = 'Calm'; ihist(i, 'Personality shift: Aggressive → Calm.'); }

  i.prog = null; i.progHrs = 0;

  if (S.settings.autoEnroll) tryEnroll(i);

/* ---------- Relationships ---------- */
function befriend(a, b) { if (a.id === b.id) return; if (!a.friends.includes(b.id) && a.friends.length < 6) a.friends.push(b.id); if (!b.friends.includes(a.id) && b.friends.length < 6) b.friends.push(a.id); a.rivals = a.rivals.filter(x => x !== b.id); b.rivals = b.rivals.filter(x => x !== a.id); }
function rival(a, b) { if (a.id === b.id) return; if (!a.rivals.includes(b.id) && a.rivals.length < 6) a.rivals.push(b.id); if (!b.rivals.includes(a.id) && b.rivals.length < 6) b.rivals.push(a.id); a.friends = a.friends.filter(x => x !== b.id); b.friends = b.friends.filter(x => x !== a.id); }
function affinity(a, b) {
  let s = rnd() * 1.2 - .6;
  for (const [x, y] of TRAIT_CLASH) if ((a.traits.includes(x) && b.traits.includes(y)) || (a.traits.includes(y) && b.traits.includes(x))) s -= .45;
  for (const [x, y] of TRAIT_BOND) if ((a.traits.includes(x) && b.traits.includes(y)) || (a.traits.includes(y) && b.traits.includes(x))) s += .4;
  if (a.gang && b.gang) s += a.gang === b.gang ? .8 : -.9;
  return s;
}
function dailyRelationships() {
  const byBlock = {};
  S.inm.forEach(i => { if (i.blk && i.disc !== 'Solitary' && i.disc !== 'Confined' && !i.infirm) (byBlock[i.blk] = byBlock[i.blk] || []).push(i); });
  for (const bid in byBlock) {
    const list = byBlock[bid]; if (list.length < 2) continue;
    const n = Math.ceil(list.length * .25);
    for (let k = 0; k < n; k++) {
      const a = pick(list), b = pick(list); if (a === b) continue;
      const s = affinity(a, b);
      if (s > .55) befriend(a, b); else if (s < -.6) { rival(a, b); }
    }
    // gang recruitment
    list.filter(i => i.gang && i.traits.includes('Leadership-oriented')).forEach(L => {
      const t = list.find(x => !x.gang && x.traits.includes('Easily influenced') && rnd() < .25);
      if (t) { t.gang = L.gang; befriend(t, L); ihist(t, `Joined ${L.gang} (recruited by ${iname(L)}).`); }
    });
  }
  // reconciliation & prune dead references
  S.inm.forEach(i => { if (i.rivals.length && rnd() < .08) { const r = i.rivals.shift(); const o = getInm(r); if (o) o.rivals = o.rivals.filter(x => x !== i.id); } });
  const ids = new Set(S.inm.map(i => i.id));
  S.inm.forEach(i => { i.friends = i.friends.filter(x => ids.has(x)); i.rivals = i.rivals.filter(x => ids.has(x)); });
}

/* ---------- Hourly simulation ---------- */
let hourFlags = {};
function effectiveAct(i, act, b, cov) {
  if (i.infirm) return 'Infirmary';
  if (i.disc === 'Solitary') return act === 'Sleep' ? 'Sleep' : act === 'Meal' ? 'Meal' : act === 'Shower' && rnd() < .3 ? 'Shower' : 'Solitary';
  if (b.status === 'Lockdown' && !['Sleep', 'Meal', 'Wake'].includes(act)) return 'Lockdown';
  if (act === 'Visits' && !S.settings.visitDays[dow()]) act = 'Free';
  if (act === 'Yard' && S.weather === 'Storm') act = 'Recreation';
  if (i.disc === 'Confined' && !['Sleep', 'Wake', 'Meal', 'Shower'].includes(act)) return 'Confined';
  if (i.disc === 'Restricted' && ['Recreation', 'Yard', 'Free', 'Visits'].includes(act)) return 'Lockdown';
  if (cov < .5 && ['Recreation', 'Yard', 'Free', 'Visits', 'Work', 'Rehab'].includes(act)) { hourFlags.cancel = hourFlags.cancel || {}; hourFlags.cancel[b.id] = true; return 'Lockdown'; }
  if (act === 'Work' && !i.job) return 'Idle';
  if (act === 'Rehab' && !i.prog) return 'Idle';
  return act;
}
const LOC = { Sleep: 'Cell (asleep)', Wake: 'Cell', Meal: 'Dining hall', Work: 'Work assignment', Recreation: 'Gym / day room', Yard: 'Exercise yard', Rehab: 'Program room', Shower: 'Showers', Free: 'Common area', Visits: 'Visitation room', Lockdown: 'Cell (locked)', Idle: 'Cell block', Infirmary: 'Infirmary', Solitary: 'Solitary confinement' };

function hourTick(h) {
  hourFlags = {};
  const shift = shiftOf(h);
  const cov = computeCoverage(shift);
  const T = S.today;
  const libBonus = Math.min(8, jobFilled('Library') * 2.5);
  const laundry = Math.min(1, jobFilled('Laundry') / Math.max(1, S.inm.length / 25));
  const janitor = Math.min(1, jobFilled('Janitorial') / Math.max(1, S.inm.length / 20));
  const maintReq = Math.ceil(totalCapacity() / 75);
  const maintOK = maintReq ? Math.min(1, staffCount('Maintenance Worker', true) / maintReq) : 1;

/* ---------- Parole & release ---------- */
function paroleScore(i) {
  const recent = S.inc.filter(x => x.who === i.id && x.sev !== 'Minor' && x.status !== 'Recorded' && curDay(x.t) > curDay() - 30).length;
  let s = 40 + (i.beh - 50) * .6 + i.paroleRec - recent * 12 - i.sev * 4 - i.priors * 2;
  if (i.job) s += 6 + Math.min(8, (curDay() - i.jobSince) / 5);
  if (i.disc === 'Solitary') s -= 20; else if (i.disc === 'Confined') s -= 14; else if (i.disc === 'Restricted') s -= 10;

}

  // probabilistic softening
  if (out === 'Continued' && rnd() < .3) out = s >= 52 ? 'Approved' : 'Denied';
  i.hearing = null; i.recommend = 0;
  S.reports.unshift({ d: curDay(), id: i.id, name: iname(i), cls: i.cls, score: s, out }); if (S.reports.length > 200) S.reports.length = 200;
  if (out === 'Approved') { S.stats.paroleApproved++; S.today.paroleA++; ihist(i, `Parole board: APPROVED (score ${s}).`); releaseInmate(i, 'Paroled'); }
  else if (out === 'Continued') { S.today.paroleC++; i.parole = curDay() + 10; ihist(i, `Parole board: continued for review in 10 days (score ${s}).`); }
  else { S.stats.paroleDenied++; S.today.paroleD++; i.parole = curDay() + 30; ihist(i, `Parole board: DENIED (score ${s}). Next eligibility in 30 days.`); }
  return out;
}
function releaseInmate(i, why) {

}

/* ---------- Inspection ---------- */
function inspectionScore() {
  const pop = S.inm.length;
  const req = requirements();
  const cov = Math.min(1, avgCoverage());
  const sup = ['Medical Staff', 'Kitchen Worker', 'Maintenance Worker', 'Administrator'].map(r => req[r] ? Math.min(1, staffCount(r) / req[r]) : 1);
  const staffing = cov * 15 + avg(sup) * 10;
  const living = pop ? avg(['hunger', 'hygiene', 'rec', 'health', 'comfort', 'social'], k => avgNeed(k)) / 100 * 25 : 12;
  const last7 = S.hist.slice(-7);
  const incs = sum(last7, h => h.incidents.Moderate * 1 + h.incidents.Major * 2 + h.incidents.Critical * 4) / Math.max(1, pop / 100) / Math.max(1, last7.length);
  const openMajor = S.inc.filter(x => x.status === 'Open' && (x.sev === 'Major' || x.sev === 'Critical')).length;
  const esc = sum(last7, h => h.escapes);
  const safety = clamp(20 - incs * 1.2 - openMajor * 2 - esc * 8, 0, 20);
  const adm = clamp(10 - S.queue.length * .5 - sum(last7, h => h.transferred) * .5, 0, 10);
  const net7 = sum(last7, h => h.inc - h.exp);
  const fin = S.money > 0 ? (net7 >= 0 ? 10 : 6) : 0;
  const engaged = pop ? S.inm.filter(i => i.job || i.prog).length / pop : 0;
  const rehab = engaged * 10;
  const parts = { 'Staffing': staffing, 'Living conditions': living, 'Safety & security': safety, 'Admissions': adm, 'Finances': fin, 'Rehabilitation & work': rehab };
  const max = { 'Staffing': 25, 'Living conditions': 25, 'Safety & security': 20, 'Admissions': 10, 'Finances': 10, 'Rehabilitation & work': 10 };
  return { score: Math.round(sum(Object.values(parts))), parts, max };
}

  S.inspections.unshift(rec); if (S.inspections.length > 30) S.inspections.length = 30;
  S.lastInspection = rec; S.lastInspectDay = curDay();
  S.stats.bestInspection = Math.max(S.stats.bestInspection, r.score);
  if (S.inm.length >= 250 && r.score >= 80) S.stats.flagship = true;
  const grade = r.score >= 85 ? 'Outstanding' : r.score >= 70 ? 'Pass' : r.score >= 55 ? 'Requires improvement' : 'Fail';
  rec.grade = grade;
  let bonus = 0;
  if (S.unlock.bonus && r.score >= 80) { bonus = Math.round(S.inm.length * 50); grant(bonus, 'Inspection performance bonus'); }
  note(r.score >= 70 ? 'good' : 'warn', `${scheduled ? 'Monthly' : 'Requested'} government inspection: ${r.score}/100 — ${grade}.`, true);

/* ---------- Officer assignment ---------- */
function autoAssignOfficers(silent) {
  const offs = S.staff.filter(s => s.role === 'Correctional Officer');
  offs.forEach(o => o.assign = null);
  const blocks = S.blocks.filter(b => b.status !== 'Construction' && b.status !== 'Closed');
  // Requirements based on capacity (anticipate filling) blended with occupancy
  const need = blocks.map(b => { const basis = Math.max(blockOcc(b), blockCap(b)); const r = Math.ceil(basis / OFFICER_RATIO[b.cls]); return { b, Day: r, Night: Math.max(1, Math.ceil(r / 2)) }; });
  const totalNeed = sum(need, x => x.Day + x.Night) || 1;
  // assign shifts in ratio Day:Night
  const dayShare = sum(need, x => x.Day) / totalNeed;
  offs.sort((a, b) => b.perf - a.perf);
  const nDay = Math.round(offs.length * dayShare);
  offs.forEach((o, k) => o.shift = k < nDay ? 'Day' : 'Night');
  for (const sh of ['Day', 'Night']) {
    const pool = offs.filter(o => o.shift === sh);
    const order = need.slice().sort((a, b) => CLASSES.indexOf(b.b.cls) - CLASSES.indexOf(a.b.cls));
    const left = Object.fromEntries(order.map(x => [x.b.id, x[sh]]));
    let idx = 0;
    // round robin by remaining need
    while (idx < pool.length) {
      const tgt = order.filter(x => left[x.b.id] > 0).sort((a, b) => left[b.b.id] - left[a.b.id])[0];
      if (!tgt) break;
      pool[idx].assign = tgt.b.id; left[tgt.b.id]--; idx++;
    }
    // extras: distribute to blocks proportional
    for (; idx < pool.length; idx++) pool[idx].assign = order.length ? order[idx % order.length].b.id : null;
  }
  if (!silent) note('info', `Officers re-assigned across ${blocks.length} blocks and two shifts.`);
}

/* ---------- Protective custody ---------- */
function yardClash(pcList, gpList) {
  // Protective custody inmates sharing the yard with general population are at serious risk
  for (const v of pcList) {
    v.n.safety = clamp(v.n.safety - 12); v.n.stress = clamp(v.n.stress + 8);
    if (rnd() < .06) {
      const a = pick(gpList); const b = getBlock(a.blk);
      const dmg = ri(15, 40); v.n.health = clamp(v.n.health - dmg); rival(a, v);
      incident(a, 'Assault on protective custody', `${iname(a)} attacked protective custody inmate ${iname(v)} (${v.pc || 'PC'}) in the exercise yard. PC and general population were scheduled in the yard at the same time.`, dmg > 30 ? 'Critical' : 'Major', b, false, [v]);
    }
  }
  if (!S.today.flagPCYard) { S.today.flagPCYard = true; note('bad', 'Protective custody inmates are sharing the yard with general population. Give Protective Custody a separate yard time in Regimes.', true); }
}
function transferToPC(i) {
  const spot = findBed('Protective');
  if (!spot) return false;
  const old = i.cls; i.cls = 'Protective'; place(i, spot.b, spot.c);
  i.parole = i.start + Math.ceil(i.sent * PAROLE_FRAC.Protective);
  i.pc = i.pcRequest ? i.pcRequest.why : 'Administrative placement'; i.pcRequest = null; i.gang = null;
  i.n.safety = clamp(i.n.safety + 25); i.n.stress = clamp(i.n.stress - 15);
  if (i.job && !jobEligible(i, i.job)) setJob(i, null);
  ihist(i, `Transferred from ${old} to Protective Custody (${cellLabel(i)}).`);
  return true;
}

/* ---------- Death row appeals ---------- */
function appealOdds(i) {
  const a = i.appeal; const st = a.stage;
  let p = [.1, .07, .06, .04][st] || .04;
  p += a.legal * .05;                       // funded legal representation
  if (st === 3) p += a.support ? .1 : 0;    // administration supports clemency
  if (i.beh > 70) p += .03;
  if (i.certs.includes('Psychiatric Treatment') || i.prog === 'Psychiatric Treatment') p += .03;
  if (i.incCount > 3) p -= .03;
  return clamp(p, .01, .6);
}
function processAppeal(i, d) {
  const a = i.appeal;
  if (i.commuted) { const sp = findBed('Maximum'); if (sp) { i.cls = 'Maximum'; place(i, sp.b, sp.c); i.appeal = null; i.pendingMove = null; ihist(i, `Moved to ${cellLabel(i)} after commutation.`); } return; }
  if (a.exec) {
    if (d >= a.exec) {
      if (rnd() < .05 + a.legal * .02) { a.exec = null; a.stage = 2; a.next = d + ri(20, 40); a.log.unshift({ d, x: 'Last-minute stay granted by the court. New federal review scheduled.' }); ihist(i, 'Execution stayed by the court.'); note('info', `Execution of ${iname(i)} (${i.id}) was stayed by the court.`); return; }
      a.log.unshift({ d, x: 'Sentence carried out.' });
      money(-15000, 'Legal & judicial', `Execution procedure ${i.id}`);
      ihist(i, 'Death sentence carried out.');
      S.stats.executions = (S.stats.executions || 0) + 1;
      S.inm.forEach(x => { if (x.blk === i.blk && x.id !== i.id) x.n.stress = clamp(x.n.stress + 12); });
      releaseInmate(i, 'Executed');
      note('warn', `Death sentence carried out: ${iname(i)} (${i.id}), Day ${d}.`);
    }
    return;
  }
  if (d < a.next) return;
  const stage = APPEAL_STAGES[a.stage];
  if (rnd() < appealOdds(i)) {
    a.log.unshift({ d, x: `${stage}: GRANTED. Death sentence commuted to life imprisonment.` });
    ihist(i, `${stage} granted — sentence commuted to life.`);
    commute(i);
    note('good', `${iname(i)} (${i.id}) won their ${stage.toLowerCase()}. Sentence commuted to life; moved to Maximum security${i.cls === 'DeathRow' ? ' (no free bed yet — remains on death row until one opens)' : ''}.`);
    return;
  }
  a.log.unshift({ d, x: `${stage}: denied.` });
  ihist(i, `${stage} denied.`);
  a.stage++; a.legal = 0;
  if (a.stage >= APPEAL_STAGES.length) {
    a.exec = d + 14; a.log.unshift({ d, x: `All appeals exhausted. Execution scheduled for Day ${a.exec}.` });
    i.n.stress = clamp(i.n.stress + 25);
    note('warn', `All appeals exhausted for ${iname(i)} (${i.id}). Execution scheduled for Day ${a.exec}.`);
  } else {
    a.next = d + ri(20, 35);
    note('info', `${iname(i)} (${i.id}): ${stage.toLowerCase()} denied. Next: ${APPEAL_STAGES[a.stage]} on Day ${a.next}.`);
  }
}
function commute(i) {
  i.commuted = true;
  const spot = findBed('Maximum');
  i.sent = 900; i.start = curDay(); i.release = curDay() + 900; i.parole = curDay() + 630;
  if (spot) { i.cls = 'Maximum'; place(i, spot.b, spot.c); i.appeal.done = true; i.appeal = null; ihist(i, `Moved to ${cellLabel(i)}.`); }
  else { i.pendingMove = 'Maximum'; }
}

/* ---------- Generic table ---------- */
function tbl(id, rows, cols, opt = {}) {
  TDEF[id] = { rows, cols, opt };
  const st = TS[id] = TS[id] || { q: '', sort: opt.sort != null ? opt.sort : null, dir: opt.dir || 1, page: 0, f: {} };
  let bar = '';
  if (opt.search !== false || opt.filters || opt.tools) {
    bar = `<div class="tbar">${opt.search !== false ? `<input type="text" placeholder="Search…" data-tq="${id}" value="${esc(st.q)}">` : ''}
      ${(opt.filters || []).map((f, k) => `<select data-tf="${id}|${k}"><option value="">${f.l}: All</option>${f.opts.map(o => `<option${st.f[k] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`).join('')}
      ${opt.tools || ''}</div>`;
  }
  return bar + `<div id="tb-${id}">${tblBody(id)}</div>`;
}
function tblBody(id) {
  const { rows, cols, opt } = TDEF[id]; const st = TS[id];
  let r = rows;
  (opt.filters || []).forEach((f, k) => { if (st.f[k]) r = r.filter(x => f.fn(x, st.f[k])); });
  if (st.q) { const q = st.q.toLowerCase(); r = r.filter(x => cols.some(c => c.q !== false && String(c.v(x)).toLowerCase().includes(q))); }
  if (st.sort != null && cols[st.sort]) { const c = cols[st.sort]; const f = c.s || c.v; r = r.slice().sort((a, b) => { const x = f(a), y = f(b); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; }); }
  const per = opt.per || 25; const pages = Math.max(1, Math.ceil(r.length / per)); if (st.page >= pages) st.page = pages - 1;
  const slice = r.slice(st.page * per, st.page * per + per);
  if (!rows.length) return `<div class="card center mut small">${opt.empty || 'Nothing here yet.'}</div>`;
  let h = `<div class="twrap"><table><thead><tr>${cols.map((c, k) => `<th class="${c.ns ? '' : 's'} ${c.r ? 'right' : ''}" ${c.ns ? '' : `data-ts="${id}|${k}"`}>${c.l}${st.sort === k ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>`;
  for (const x of slice) {
    h += `<tr${opt.row ? ` class="click" data-a="${opt.row}" data-arg="${esc(opt.rowArg(x))}"` : ''}>${cols.map(c => `<td class="${c.r ? 'right' : ''}">${c.h ? c.h(x) : esc(c.v(x))}</td>`).join('')}</tr>`;
  }
  h += `</tbody></table></div>`;
  if (!slice.length) h += `<div class="small mut center mt6">No matches.</div>`;
  h += `<div class="pager">${r.length} record${r.length === 1 ? '' : 's'} · page ${st.page + 1}/${pages}
    <button class="btn sm" data-tp="${id}|-1"${st.page === 0 ? ' disabled' : ''}>‹ Prev</button><button class="btn sm" data-tp="${id}|1"${st.page >= pages - 1 ? ' disabled' : ''}>Next ›</button></div>`;
  return h;
}

/* ---------- Recommendations ---------- */
function issues() {
  const out = []; if (!S) return out;
  const req = requirements();
  const pop = S.inm.length;
  const open = S.inc.filter(x => x.status === 'Open');
  if (S.money < 0) out.push(['bad', `Balance is negative (${fmt$(S.money)}). Staff morale and attendance will fall. Cut costs or admit more funded inmates.`, 'finance']);
  const y = S.hist[S.hist.length - 1];
  if (y && y.inc - y.exp < 0 && S.money > 0) out.push(['warn', `Yesterday ran a deficit of ${fmt$(y.exp - y.inc)}. Review expenses or raise intake to fill empty beds.`, 'finance']);
  if (open.length) out.push([open.some(x => x.sev === 'Critical') ? 'bad' : 'warn', `${open.length} incident${open.length > 1 ? 's need' : ' needs'} a disciplinary decision. Unresolved incidents lapse after 3 days and hurt safety.`, 'security']);
  const offHave = staffCount('Correctional Officer'), offReq = req['Correctional Officer'];
  if (offHave < offReq) out.push(['warn', `Officer shortfall: ${offHave} employed, ${offReq} needed for current occupancy across both shifts. Hire officers in Personnel.`, 'personnel']);
  const cov = computeCoverage(shiftOf(curHour()));
  const thin = S.blocks.filter(b => blockOcc(b) && cov[b.id] < .75);
  if (thin.length && offHave >= offReq) out.push(['warn', `Thin coverage in ${thin.map(b => b.name).join(', ')}. Use "Auto-assign officers" in Personnel.`, 'personnel']);
  ['Medical Staff', 'Kitchen Worker', 'Maintenance Worker', 'Administrator'].forEach(r => { if (staffCount(r) < req[r]) out.push(['warn', `${r}: ${staffCount(r)} employed, ${req[r]} recommended.`, 'personnel']); });
  const use = dailyFoodUse();
  if (pop && S.food < use * 1.5) out.push([S.food < use ? 'bad' : 'warn', `Food inventory covers ${(S.food / Math.max(1, use)).toFixed(1)} days. ${S.settings.autoReorder ? 'Auto-reorder will top up at midnight.' : 'Buy food in Kitchen or enable auto-reorder.'}`, 'kitchen']);
  if (S.queue.length) out.push(['warn', `${S.queue.length} inmates in the pending intake queue. Build cell blocks or lower intake to avoid transfers.`, 'intake']);
  CLASSES.filter(c => S.unlock.classes.includes(c)).forEach(c => { const cap = totalCapacity(c); if (cap && freeBeds(c) / cap < .1 && S.settings.intake[c] > 0) out.push(['info', `${c} housing is ${Math.round((1 - freeBeds(c) / cap) * 100)}% full. Consider building another ${c} block.`, 'housing']); });
  if (pop) {
    const stress = avgNeed('stress'); if (stress > 60) out.push(['warn', `Average stress is high (${Math.round(stress)}). More recreation, free time, better meals or counseling will help.`, 'regimes']);
    const hy = avgNeed('hygiene'); if (hy < 40) out.push(['warn', `Hygiene is low (${Math.round(hy)}). Add shower periods or laundry workers.`, 'regimes']);
    const rec = avgNeed('rec'); if (rec < 35) out.push(['warn', `Recreation needs are unmet (${Math.round(rec)}). Add recreation or free time to the regime.`, 'regimes']);
    const idle = S.inm.filter(i => !i.job && !i.prog).length;
    if (idle / pop > .5 && pop > 10) out.push(['info', `${idle} inmates have neither a job nor a program. Add job positions or program staff to improve behavior and parole outcomes.`, 'employment']);
  }
  const due = S.inm.filter(i => i.hearing).length;
  if (due) out.push(['info', `${due} parole hearing${due > 1 ? 's are' : ' is'} due.`, 'parole']);
  if (S.blocks.some(b => b.status === 'Lockdown')) out.push(['info', `Lockdown in effect: ${S.blocks.filter(b => b.status === 'Lockdown').map(b => b.name).join(', ')}.`, 'housing']);
  return out;
}

function openInmate(id) {
  let i = getInm(id); let queued = false;
  if (!i) { i = S.queue.find(x => x.id === id); queued = !!i; }

  UI.prof = id; renderProfile(i, queued);
}

A.inmate = id => { UI.profTab = 'Overview'; openInmate(id); };

C.pMoveSel = v => { if (!v) return; const i = getInm(UI.prof); const [bid, n] = v.split(':'); const b = getBlock(bid); const c = b && b.cells.find(c => c.n === +n); if (i && c && c.occ.length < c.beds) { place(i, b, c); ihist(i, `Moved to ${cellLabel(i)}.`); dirty(); toast('good', `${iname(i)} moved to ${cellLabel(i)}.`); } openInmate(UI.prof); };
C.pReclass = v => { const i = getInm(UI.prof); if (!i || v === i.cls) return; if (v === 'DeathRow' || (i.cls === 'DeathRow' && !i.commuted)) { toast('bad', 'Death sentences are set by the courts — inmates cannot be moved on or off death row administratively.'); openInmate(UI.prof); return; } if (v === 'Insane' && i.psych == null) { i.psych = 40; i.dx = pick(INSANE_DX); } const spot = findBed(v); if (!spot) { toast('bad', `No free ${v} beds. Build or expand a ${v} block first.`); openInmate(UI.prof); return; } const old = i.cls; i.cls = v; place(i, spot.b, spot.c); i.parole = i.start + Math.ceil(i.sent * PAROLE_FRAC[v]); ihist(i, `Reclassified ${old} → ${v}. Moved to ${cellLabel(i)}.`); if (i.job && !jobEligible(i, i.job)) setJob(i, null); dirty(); openInmate(UI.prof); };
C.pSanctionSel = v => { UI.pSan = v; };
A.pSanction = id => { const i = getInm(id); if (!i || !UI.pS || UI.pS.id !== id || !UI.pS.list.length) return; const list = UI.pS.list; const names = list.map(x => x.s).join(' + '); const inc = incident(i, 'Administrative sanction', `Sanctions issued by administration: ${names}.`, 'Minor', getBlock(i.blk)); applySanctions(inc, list); UI.pS = null; dirty(); toast('info', `${names} applied to ${iname(i)}.`); openInmate(id); };
C.pJob = v => { const i = getInm(UI.prof); if (!i) return; setJob(i, v || null); dirty(); openInmate(UI.prof); };

function assignNewOfficer(o) {

  let best = null, gap = -99;

function schedWarnings(c) {
  const s = S.sched[c]; const n = a => s.filter(x => x === a).length; const out = [];
  const pop = S.inm.filter(i => i.cls === c).length;
  if (n('Meal') < 3) out.push(['bad', `Only ${n('Meal')} meal period${n('Meal') === 1 ? '' : 's'}. Inmates need 3 meals a day.`]);
  if (n('Meal') > 4) out.push(['warn', `${n('Meal')} meal periods will raise food costs.`]);
  if (n('Sleep') < 6) out.push(['warn', `Only ${n('Sleep')} hours of sleep — stress will rise.`]);

  if (!n('Yard')) out.push(['info', 'No yard time: inmates never go outdoors. Yard is the best activity for recreation and stress.']);
  s.forEach((a, hr) => { if (a !== 'Yard') return; const using = S.inm.filter(i => S.sched[i.cls][hr] === 'Yard').length; const cap = (S.yards || 0) * YARD_CAP; if (using > cap) out.push(['bad', `${String(hr).padStart(2, '0')}:00 yard: ${using} inmates scheduled, capacity ${cap}. Stagger times or build another yard.`]); if (c === 'Protective' && CLASSES.some(k => k !== 'Protective' && S.sched[k][hr] === 'Yard' && S.inm.some(i => i.cls === k))) out.push(['bad', `${String(hr).padStart(2, '0')}:00: Protective Custody shares the yard with general population — PC inmates will be attacked.`]); if (c !== 'Protective' && S.sched.Protective[hr] === 'Yard' && S.inm.some(i => i.cls === 'Protective') && pop) out.push(['bad', `${String(hr).padStart(2, '0')}:00: yard time overlaps with Protective Custody.`]); });
  if (n('Work')) { const posts = sum(JOB_NAMES.filter(j => S.unlock.jobs[j] && S.jobs[j].on && S.jobs[j].elig.includes(c)), j => S.jobs[j].pos); if (!posts) out.push(['warn', `Employment hours scheduled but no jobs accept ${c} inmates.`]); }
  if (n('Rehab')) { const progs = PROG_NAMES.filter(p => S.unlock.progs[p] && S.progs[p].on && S.progs[p].elig.includes(c)); const seats = sum(progs, progSeats); if (!seats) out.push(['warn', 'Rehabilitation hours scheduled but no program staff are available.']); else { const enr = S.inm.filter(i => i.prog && progs.includes(i.prog)).length; if (enr > seats) out.push(['info', `Program rooms: ${seats} seats/hour shared across classifications, ${enr} enrolled.`]); } }
  if (n('Visits') && !S.settings.visitDays.some(Boolean)) out.push(['info', 'Visitation scheduled but no visiting days are set (Visitors page).']);
  if (n('Meal') && pop) { const kc = kitchenCapacity(); let worst = 0; s.forEach((a, hr) => { if (a === 'Meal') worst = Math.max(worst, S.inm.filter(i => S.sched[i.cls][hr] === 'Meal').length); }); if (kc < worst) out.push(['bad', `Kitchen serves ${kc} per sitting but up to ${worst} inmates eat together at this classification's meal times. Stagger meals or add kitchen staff.`]); }

}

/* ---------- Reports ---------- */
V.reports = () => {
  const tabs = ['Daily', 'Weekly', 'Monthly'];
  const n = { Daily: 1, Weekly: 7, Monthly: 30 }[UI.repTab];
  const L = S.hist.slice(-n), P = S.hist.slice(-2 * n, -n);
  let h = `<h1>Reports</h1><p class="sub">Administrative reports are generated at midnight. ${S.hist.length} days of history recorded.</p>`;
  h += `<div class="tabs">${tabs.map(t => `<button class="${t === UI.repTab ? 'on' : ''}" data-a="repTab" data-arg="${t}">${t}</button>`).join('')}</div>`;
  if (!L.length) return h + '<div class="card mut">No reports yet. The first daily report is produced at midnight.</div>';
  const agg = (arr, f) => sum(arr, f);
  const rows = [
    ['Population (end)', L[L.length - 1].pop, P.length ? P[P.length - 1].pop : null],
    ['Capacity (end)', L[L.length - 1].cap, P.length ? P[P.length - 1].cap : null],
    ['Admissions received', agg(L, x => x.recv), P.length ? agg(P, x => x.recv) : null],
    ['Redirected / transferred', agg(L, x => x.rejected + x.transferred), P.length ? agg(P, x => x.rejected + x.transferred) : null, true],
    ['Income', fmt$(agg(L, x => x.inc)), P.length ? fmt$(agg(P, x => x.inc)) : null],
    ['Expenses', fmt$(agg(L, x => x.exp)), P.length ? fmt$(agg(P, x => x.exp)) : null],
    ['Net', fmt$(agg(L, x => x.inc - x.exp)), P.length ? fmt$(agg(P, x => x.inc - x.exp)) : null],
    ['Incidents (all)', agg(L, x => sum(Object.values(x.incidents))), P.length ? agg(P, x => sum(Object.values(x.incidents))) : null, true],
    ['  Major + Critical', agg(L, x => x.incidents.Major + x.incidents.Critical), P.length ? agg(P, x => x.incidents.Major + x.incidents.Critical) : null, true],
    ['Escapes', agg(L, x => x.escapes), P.length ? agg(P, x => x.escapes) : null, true],
    ['Meals served', fmtN(agg(L, x => x.meals)), P.length ? fmtN(agg(P, x => x.meals)) : null],
    ['Meals missed', agg(L, x => x.short), P.length ? agg(P, x => x.short) : null, true],
    ['Program enrollment (end)', L[L.length - 1].enrolled, P.length ? P[P.length - 1].enrolled : null],
    ['Program completions', agg(L, x => x.completions), P.length ? agg(P, x => x.completions) : null],
    ['Inmates employed (end)', L[L.length - 1].employed, P.length ? P[P.length - 1].employed : null],
    ['Parole approved / continued / denied', `${agg(L, x => x.paroleA)} / ${agg(L, x => x.paroleC)} / ${agg(L, x => x.paroleD)}`, P.length ? `${agg(P, x => x.paroleA)} / ${agg(P, x => x.paroleC)} / ${agg(P, x => x.paroleD)}` : null],
    ['Releases', agg(L, x => x.releases), P.length ? agg(P, x => x.releases) : null],
    ['Avg inmate satisfaction', Math.round(avg(L, x => x.sat)), P.length ? Math.round(avg(P, x => x.sat)) : null],
    ['Avg safety', Math.round(avg(L, x => x.needs.safety)), P.length ? Math.round(avg(P, x => x.needs.safety)) : null],
    ['Avg officer coverage', pct(Math.min(1, avg(L, x => x.cov))), P.length ? pct(Math.min(1, avg(P, x => x.cov))) : null],
    ['Visits', agg(L, x => x.visits), P.length ? agg(P, x => x.visits) : null],
    ['Contraband finds', agg(L, x => x.contraband), P.length ? agg(P, x => x.contraband) : null, true]
  ];
  h += `<div class="grid g2 mb"><div class="card"><h3>${UI.repTab} report · Day ${L[0].d}${L.length > 1 ? '–' + L[L.length - 1].d : ''}</h3><div class="twrap"><table><thead><tr><th>Metric</th><th class="right">This period</th><th class="right">Previous</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r[0]}</td><td class="right mono">${r[1]}</td><td class="right mono dim">${r[2] == null ? '—' : r[2]}</td></tr>`).join('')}</tbody></table></div></div>
    <div><div class="card mb"><h3>Problems & recommendations</h3>${reportRecs(L).map(([l, m]) => `<div class="alert ${l}">${m}</div>`).join('') || '<div class="alert good">No significant problems in this period.</div>'}</div>
    <div class="card"><h3>Trends</h3><div class="small mut">Satisfaction</div>${spark(S.hist.slice(-30).map(x => x.sat), 'var(--info)')}<div class="small mut mt6">Net income per day</div>${spark(S.hist.slice(-30).map(x => x.inc - x.exp), 'var(--good)')}<div class="small mut mt6">Officer coverage</div>${spark(S.hist.slice(-30).map(x => Math.min(1, x.cov)), 'var(--acc)')}</div></div></div>`;
  h += `<div class="card"><h3>Inspection history</h3>${S.inspections.length ? `<div class="twrap"><table><thead><tr><th>Day</th><th>Type</th><th class="right">Score</th><th>Grade</th>${Object.keys(S.inspections[0].parts).map(k => `<th class="right">${k}</th>`).join('')}</tr></thead><tbody>
    ${S.inspections.map(r => `<tr><td>D${r.d}</td><td>${r.scheduled ? 'Monthly' : 'Requested'}</td><td class="right mono ${r.score >= 70 ? 'good' : 'warn'}">${r.score}</td><td>${r.grade}</td>${Object.keys(r.parts).map(k => `<td class="right mono">${r.parts[k].toFixed(1)}/${r.max[k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<div class="small mut">No inspections yet. Monthly inspections happen automatically every 30 days; you can request one in Administration.</div>'}</div>`;
  return h;
};
function reportRecs(L) {
  const out = []; const last = L[L.length - 1];
  const net = sum(L, x => x.inc - x.exp);
  if (net < 0) { const top = {}; L.forEach(x => { for (const k in x.expBy) top[k] = (top[k] || 0) + x.expBy[k]; }); const t = Object.entries(top).sort((a, b) => b[1] - a[1])[0]; out.push(['bad', `Operating deficit of ${fmt$(-net)}. Largest cost: ${t ? t[0] + ' (' + fmt$(t[1]) + ')' : '—'}. Fill empty beds (raise intake), trim surplus staff, or lower meal quality.`]); }
  const empty = last.cap - last.pop; if (empty / Math.max(1, last.cap) > .25) out.push(['warn', `${empty} beds (${Math.round(empty / last.cap * 100)}%) are empty and earn no funding. Raise daily intake allowances.`]);
  const short = sum(L, x => x.short); if (short) out.push(['bad', `${short} meals missed. Increase kitchen staff or food stock.`]);
  const mc = sum(L, x => x.incidents.Major + x.incidents.Critical); if (mc / L.length > 1) out.push(['warn', `${mc} major/critical incidents. Check officer coverage, separate rivals, and enrol aggressive inmates in Anger Management.`]);
  if (sum(L, x => x.escapes)) out.push(['bad', `${sum(L, x => x.escapes)} escape(s). Coverage in high-security blocks must be raised.`]);
  if (avg(L, x => x.cov) < .8) out.push(['warn', `Average officer coverage ${pct(avg(L, x => x.cov))}. Hire officers or rebalance shifts.`]);
  if (last.needs.hygiene < 40) out.push(['warn', 'Hygiene is low — add shower periods or upgrade cells to Tier 2.']);
  if (last.needs.rec < 40) out.push(['warn', 'Recreation is low — schedule more recreation/free time or staff the library.']);
  if (last.needs.stress > 55) out.push(['warn', 'Stress is elevated — improve meals, recreation, visits and counseling.']);
  if (last.pop && last.enrolled / last.pop < .2) out.push(['info', 'Under 20% of inmates are in programs. More program staff improve parole outcomes.']);
  if (sum(L, x => x.rejected + x.transferred)) out.push(['warn', `${sum(L, x => x.rejected + x.transferred)} admissions were redirected or transferred because no suitable beds were free.`]);
  if (sum(L, x => x.contraband) > L.length) out.push(['info', 'Frequent contraband: tighten visitor screening or increase cell searches.']);
  return out;
}

/* ---------- Death row appeals ---------- */
function deathRowCard() {
  const dr = S.inm.filter(i => i.appeal);
  if (!dr.length && !S.unlock.classes.includes('DeathRow')) return '';
  let h = `<div class="card mb"><div class="spread"><h3>Death row appeals (${dr.length})</h3><span class="tiny dim">Executions carried out: ${S.stats.executions || 0}</span></div>`;
  if (!dr.length) return h + '<div class="small mut">Nobody is on death row.</div></div>';
  h += `<p class="small mut">Every death sentence goes through four stages: ${APPEAL_STAGES.join(' → ')}. Winning any stage commutes the sentence to life in Maximum security. If all four are denied, an execution date is set 14 days later (a court may still grant a last-minute stay). You can fund a legal team ($5,000 per stage) and, at the clemency stage, formally support clemency.</p>
  <div class="twrap"><table><thead><tr><th>Inmate</th><th>Charges</th><th>Stage</th><th>Next date</th><th class="right">Odds</th><th class="right">Behavior</th><th>Psychiatric care</th><th></th></tr></thead><tbody>
  ${dr.sort((a, b) => (a.appeal.exec || a.appeal.next) - (b.appeal.exec || b.appeal.next)).map(i => { const a = i.appeal; return `<tr><td>${inmLink(i.id, iname(i))} <span class="mono tiny dim">${i.id}</span></td><td class="small" style="white-space:normal">${esc(i.charges[0])}</td>
    <td>${i.commuted ? '<span class="good">Commuted — awaiting Max bed</span>' : a.exec ? '<span class="bad">Appeals exhausted</span>' : `${a.stage + 1}/4 · ${APPEAL_STAGES[a.stage]}`}</td>
